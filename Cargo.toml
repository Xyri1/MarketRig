[workspace]
resolver = "3"
members = [
    "crates/marketrigd",
    "crates/marketrig",
    "crates/marketrig-mcp",
    "crates/marketrig-acceptance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# The error type the `nautilus-*` client traits return; pinned at the line the
# nautilus graph already resolves, so there is one copy.
anyhow = "=1.0.104"
# The `nautilus-*` client traits are `#[async_trait(?Send)]`, so implementing
# one needs the same macro; pinned at the line the nautilus graph resolves.
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["ws"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
clap = { version = "=4.6.6", features = ["derive"] }
# `StreamExt` for the WebSocket clients; already in the graph under
# tokio-tungstenite and rmcp.
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.4.3"
# The nautilus set is pinned in lockstep (per D39) and every entry disables
# default features: `nautilus-sandbox` alone defaults `high-precision`, and
# Cargo's feature unification would flip the whole graph to 128-bit (D76).
nautilus-common = { version = "=0.62.0", default-features = false, features = ["live"] }
nautilus-core = { version = "=0.62.0", default-features = false }
nautilus-data = { version = "=0.62.0", default-features = false }
nautilus-execution = { version = "=0.62.0", default-features = false }
# `node` is a default feature and carries `LiveNode` itself; `live` on
# nautilus-common carries the data-event sender. Neither touches precision.
nautilus-live = { version = "=0.62.0", default-features = false, features = ["node"] }
nautilus-model = { version = "=0.62.0", default-features = false }
nautilus-sandbox = { version = "=0.62.0", default-features = false }
# The terminal manager terminates a `portable-pty` child's tree by pid on Unix
# (`killpg` on the session `portable-pty`'s `setsid` created) and by Job Object
# on Windows, the same mechanics `exec::spawn` wraps for children MarketRig
# spawns itself (R3-2, slice 004 §2). Both are already in the graph.
libc = "=0.2.189"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# The PTY pair behind the terminal manager (per D31, R3-2); ConPTY on Windows.
portable-pty = { version = "=0.9.0", default-features = false }
# The one spawn-and-terminate primitive for every managed child (per D73, R2-3):
# a `setsid` session on macOS, a Job Object on Windows. Already in the graph
# under `rmcp =3.2.0`; MarketRig names only the wrappers it uses.
process-wrap = { version = "=9.1.0", default-features = false, features = [
    "tokio1",
    "process-session",
    "job-object",
    "kill-on-drop",
] }
# Beside `ureq` because the chart client polls from inside the node thread's
# `LocalSet`, where a blocking agent would stall the runner; pinned at 0.13.4,
# the line `nautilus-network` itself pins.
reqwest = { version = "=0.13.4", features = ["json"] }
# The code snapshot's SHA-256 fingerprint (R2-3); already in the graph under rustls.
ring = "=0.17.14"
rmcp = { version = "=3.2.0", default-features = false }
# RFC 5545 recurrence, iterated in a fixed UTC frame; zones are resolved by
# `chrono-tz`, never by this crate (R2-1). Its defaults are empty already.
rrule = { version = "=0.14.0", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rust_decimal = "=1.42.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = "=0.39.6"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "net",
    "signal",
    "macros",
    "sync",
    "time",
    "process",
] }
# The daemon's app-server client and the bridge's channel client; the line
# axum's `ws` feature resolves, so one copy. Loopback only, so no TLS.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
ureq = { version = "=3.4.0", features = ["json"] }
uuid = { version = "=1.26.0", features = ["v7"] }
