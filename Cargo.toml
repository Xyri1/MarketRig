[workspace]
resolver = "3"
members = ["crates/marketrigd", "crates/marketrig", "crates/marketrig-acceptance"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "=0.8.9"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
clap = { version = "=4.6.6", features = ["derive"] }
getrandom = "=0.4.3"
# The nautilus set is pinned in lockstep (per D39) and every entry disables
# default features: `nautilus-sandbox` alone defaults `high-precision`, and
# Cargo's feature unification would flip the whole graph to 128-bit (D76).
nautilus-common = { version = "=0.62.0", default-features = false }
nautilus-core = { version = "=0.62.0", default-features = false }
nautilus-data = { version = "=0.62.0", default-features = false }
nautilus-execution = { version = "=0.62.0", default-features = false }
nautilus-live = { version = "=0.62.0", default-features = false }
nautilus-model = { version = "=0.62.0", default-features = false }
nautilus-sandbox = { version = "=0.62.0", default-features = false }
reqwest = { version = "=0.13.4", features = ["json"] }
rmcp = { version = "=3.2.0", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rust_decimal = "=1.42.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = "=0.39.6"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
ureq = { version = "=3.4.0", features = ["json"] }
uuid = { version = "=1.26.0", features = ["v7"] }
