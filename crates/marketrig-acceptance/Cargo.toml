[package]
name = "marketrig-acceptance"
version.workspace = true
edition.workspace = true
publish = false

# The harness drives public surfaces only (per R0-7, root SPEC §17): the spawned
# binaries, the loopback API, the desk's MCP surface through the harness's own
# MCP client, workspace files, and read-only SQLite. It never depends on
# marketrigd, so every shape it asserts is re-stated from the SPEC on purpose.
#
# The gate and the experiment are two test targets over one library target, which
# is where the shared harness lives: an integration test binary cannot share code
# with another one.
[dependencies]
# The stand-in chart feed (R1 feature SPEC §10.1) — loopback only.
axum.workspace = true
# G19's own MCP client, spawning the real adapter over stdio (per D4, D75).
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
# `runtime-standin` (R3 feature SPEC §9.1): the Codex halves' WebSocket client
# and the stream adapters it reads with, on the daemon's own pinned lines.
futures-util.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
ureq.workspace = true

# E4 makes the operator's own console the desk's terminal (R3 feature SPEC
# §9.3): raw mode and the window size, from the platform itself. Both crates are
# already in the workspace graph; the acceptance crate only names the console
# API it needs on Windows.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Console"] }
